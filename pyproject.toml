[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-design-patterns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langchain>=1.2.13",
    "langchain-anthropic>=1.1.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.1.3",
    "openai>=2.29.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-include-markdown-plugin>=7.3.0",
]
harnesses = [
    "deepagents>=0.7.9",
    "mcp>=2.1.1",
]

# The repo's first pytest config. Without `testpaths`, bare `pytest` collects
# from the rootdir down, which would pull in `harnesses/` even when its
# optional dependency group isn't installed. Listing the roots explicitly
# keeps collection predictable; `importorskip` inside the harness tests then
# turns a missing dependency into a skip rather than a collection error.
[tool.pytest.ini_options]
testpaths = ["patterns", "shared", "harnesses"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "patterns*", "harnesses*"]
